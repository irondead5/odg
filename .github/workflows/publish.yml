name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm distribution tag'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - beta
          - next
          - canary

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build package
        run: pnpm run build

      - name: Determine npm dist-tag and publish
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then
              TAG="beta"
            else
              TAG="latest"
            fi
          else
            TAG="${{ inputs.dist_tag }}"
          fi

          echo "Publishing to npm with dist-tag: $TAG"
          npm publish --provenance --access public --tag "$TAG"
